<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MIT - Laboratorio</title>
    <style></style>
    <link rel="stylesheet" href="/styles/newCons.css">
</head>
    <body>
    <div class="portal-container">
        <h1>Escribe una nueva consulta</h1>
        <p>Registra una consulta nueva con el fin de poder verla despues.</p>

        <div class="Create-form">
            <h2>Consulta</h2>
            <form action="/newCons.html" method="POST">
                <div class="form-group">
                    <label for="username">Usuario:</label>
                    <input type="email" id="username" name="username" required>
                </div>
                <div class="form-group">
                    <label for="password">Contraseña:</label>
                    <input type="password" id="password" name="password" required>
                </div>
                <button type="submit">Enviar</button>
            </form>
        </div>

        <a href="../index.html" class="back-link">Volver a la página principal</a>
    </div>
</body>
</html>
